# Lab-specific allowlist on top of the default gitleaks ruleset.
title = "multipass-vault-tpm"

[extend]
useDefault = true

[allowlist]
description = "docs/demo-output.txt is a checked-in demo transcript. It intentionally prints TSS2 PRIVATE KEY headers to show a TPM-wrapped object, not an exportable private key."
paths = [
  '''(^|/)docs/demo-output\.txt$''',
]
